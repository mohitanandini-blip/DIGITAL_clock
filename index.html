<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <title>radio nitroz</title>
    <link rel="icon" type="image/jpg" href="rnlogo.jpg">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
 
   <div class="content"> <h3>RADIONITROZ PRESENTS</h3> <br>
    <h1>WAVE CRAZE 3.0</h1></div>
    <div class="box">
    <div id="time">
        <div class="circle" style="--clr: #06b0c7;">
        <div class="dots day_dot"></div>
            <svg>
                <circle cx="70" cy="70" r="70"></circle>
               <circle cx="70" cy="70" r="70" id="dd"></circle>
            </svg>
            <div id="days">00<br><span>Days</span></div>
        </div>
         <div class="circle" style="--clr: #ff0368;">
        <div class="dots hr_dot"></div>
            <svg>
                <circle cx="70" cy="70" r="70"></circle>
               <circle cx="70" cy="70" r="70" id="hh"></circle>
            </svg>
            <div id="hours">00</div>
        </div>
 <div class="circle" style="--clr: #f3a915;">
        <div class="dots min_dot"></div>
            <svg>
                <circle cx="70" cy="70" r="70"></circle>
               <circle cx="70" cy="70" r="70" id="mm"></circle>
            </svg>
            <div id="minutes">00</div>
        </div>
 <div class="circle" style="--clr:#c096e3;">
        <div class="dots sec_dot"></div>
            <svg>
                <circle cx="70" cy="70" r="70"></circle>
               <circle cx="70" cy="70" r="70" id="ss"></circle>
            </svg>
            <div id="seconds">00</div>
        </div>
    </div>
    
<h2 class="fest">The Fest Is <span>Live Now</span></h2>
    </div>
    <script src="script.js"></script>
</body>
</html>
